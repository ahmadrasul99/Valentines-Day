<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Proposal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="emoji-header">
                💗 🧸 💗
            </div>
            
            <h1 class="question">Aisha, will you be my valentine?</h1>
            <p class="subtitle">A very serious question from the love of your life.</p>
            
            <div class="image-container">
                <img src="proposal-image.jpg" alt="Ahmed and Aisha" class="proposal-image">
            </div>
            
            <button class="btn btn-yes" id="yesBtn">Yes 💘</button>
            <button class="btn btn-no" id="noBtn">No</button>
            
            <p class="tip">Tip: "No" is shy.</p>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="emoji-header">
                🧸 💐 💗
            </div>
            <h2 class="modal-title">YAYYYYY!</h2>
            <p class="modal-text">Happy Valentine's Day my princess 💗</p>
            
            <button class="btn btn-reveal" id="revealBtn">Reveal 📸</button>
            <button class="btn btn-close" id="closeBtn">Close</button>
        </div>
    </div>

    <!-- Photo Modal -->
    <div class="modal" id="photoModal">
        <div class="modal-content">
            <div class="emoji-header">
                🧸 💐 💗
            </div>
            <h2 class="modal-title">YAYYYYY!</h2>
            <p class="modal-text">Happy Valentine's Day my princess 💗</p>
            
            <div class="photo-container">
                <img src="couple-photo.jpg" alt="Ahmed and Aisha" class="couple-photo">
            </div>
            
            <button class="btn btn-close" id="closePhotoBtn">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
